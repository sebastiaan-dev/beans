# .github/workflows/release.yml
name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # packages: write
  # issues: write
  # id-token: write

jobs:
  goreleaser:
    # Publishes to hmans/homebrew-beans with HOMEBREW_TAP_TOKEN, which only the
    # upstream repository has; forks skip the job instead of failing.
    if: github.repository == 'hmans/beans'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install mise
        shell: bash
        run: |
          if [ ! -f "$HOME/.local/bin/mise" ]; then
            curl https://mise.run | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: ./.github/actions/setup-frontend
      - name: Install Go dependencies
        run: mise deps:backend
      - name: Build frontend
        run: mise build:frontend
      # More assembly might be required: Docker logins, GPG, etc.
      # It all depends on your needs.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Your GoReleaser Pro key, if you are using the 'goreleaser-pro' distribution
          # GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
