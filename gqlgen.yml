# gqlgen configuration
# See https://gqlgen.com/config/ for details

schema:
  - internal/graph/*.graphqls

exec:
  filename: internal/graph/generated.go
  package: graph

model:
  filename: pkg/beangraph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph

# Autobind to existing types
autobind:
  - github.com/hmans/beans/pkg/bean

models:
  # Use existing Bean type from bean package
  Bean:
    model: github.com/hmans/beans/pkg/bean.Bean
  # Hand-written model: git status fields and beans are computed lazily by
  # field resolvers so queries that don't select them run no git commands.
  Worktree:
    model: github.com/hmans/beans/pkg/beangraph/model.Worktree
    fields:
      beans:
        resolver: true
      hasChanges:
        resolver: true
      hasUnmergedCommits:
        resolver: true
      commitsBehind:
        resolver: true
      hasConflicts:
        resolver: true
  # Map ID scalar to string
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
